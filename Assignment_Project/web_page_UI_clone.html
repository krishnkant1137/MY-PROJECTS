<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Page</title>
  <link rel="stylesheet" href="./web_page_UI_clone.css">
</head>
<body>
  <div class="border">
  <header class="navbar">
    <div class="logo"><img src="./Assets/website-logo.png" alt=""></div>
    <nav class="menu">
      <a href="#">Retail</a>
      <a href="#">SME</a>
      <a href="#">Corporate</a>
      <a href="#">About Us</a>
      <a href="#">COVID 19</a>

    </nav>
    <div style="display: flex; justify-content: center; text-align: center;">
